basePath: /api
definitions:
  auth.authenticatePayload:
    properties:
      Password:
        description: Password
        example: mypassword
        type: string
      Username:
        description: Username
        example: admin
        type: string
    required:
    - Password
    - Username
    type: object
  auth.authenticateResponse:
    properties:
      jwt:
        description: JWT token used to authenticate against the API
        example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzAB
        type: string
    type: object
  auth.oauthPayload:
    properties:
      Code:
        description: OAuth code returned from OAuth Provided
        type: string
    type: object
  backup.backupPayload:
    properties:
      Password:
        type: string
    type: object
  backup.restorePayload:
    properties:
      FileContent:
        items:
          format: int32
          type: integer
        type: array
      FileName:
        type: string
      Password:
        type: string
    type: object
  build.BuildInfo:
    properties:
      BuildNumber:
        type: string
      GitCommit:
        type: string
      GoVersion:
        type: string
      ImageTag:
        type: string
      NodejsVersion:
        type: string
      PnpmVersion:
        type: string
      WebpackVersion:
        type: string
    type: object
  build.DependenciesInfo:
    properties:
      ComposeVersion:
        type: string
      DockerVersion:
        type: string
      HelmVersion:
        type: string
      KubectlVersion:
        type: string
    type: object
  build.RuntimeInfo:
    properties:
      Env:
        items:
          type: string
        type: array
    type: object
  containers.containerGpusResponse:
    properties:
      gpus:
        type: string
    type: object
  customtemplates.customTemplateFromFileContentPayload:
    properties:
      Description:
        description: Description of the template
        example: High performance web server
        type: string
      EdgeTemplate:
        description: EdgeTemplate indicates if this template purpose for Edge Stack
        example: false
        type: boolean
      FileContent:
        description: Content of stack file
        type: string
      Logo:
        description: URL of the template's logo
        example: https://portainer.io/img/logo.svg
        type: string
      Note:
        description: A note that will be displayed in the UI. Supports HTML content
        example: This is my <b>custom</b> template
        type: string
      Platform:
        allOf:
        - $ref: '#/definitions/portainer.CustomTemplatePlatform'
        description: |-
          Platform associated to the template.
          Valid values are: 1 - 'linux', 2 - 'windows'
          Required for Docker stacks
        enum:
        - 1
        - 2
        example: 1
      Title:
        description: Title of the template
        example: Nginx
        type: string
      Type:
        allOf:
        - $ref: '#/definitions/portainer.StackType'
        description: |-
          Type of created stack:
          * 1 - swarm
          * 2 - compose
          * 3 - kubernetes
        enum:
        - 1
        - 2
        - 3
        example: 1
      Variables:
        description: Definitions of variables in the stack file
        items:
          $ref: '#/definitions/portainer.CustomTemplateVariableDefinition'
        type: array
    required:
    - Description
    - FileContent
    - Title
    - Type
    type: object
  customtemplates.customTemplateFromGitRepositoryPayload:
    properties:
      ComposeFilePathInRepository:
        default: docker-compose.yml
        description: Path to the Stack file inside the Git repository
        example: docker-compose.yml
        type: string
      Description:
        description: Description of the template
        example: High performance web server
        type: string
      EdgeTemplate:
        description: EdgeTemplate indicates if this template purpose for Edge Stack
        example: false
        type: boolean
      IsComposeFormat:
        description: IsComposeFormat indicates if the Kubernetes template is created
          from a Docker Compose file
        example: false
        type: boolean
      Logo:
        description: URL of the template's logo
        example: https://portainer.io/img/logo.svg
        type: string
      Note:
        description: A note that will be displayed in the UI. Supports HTML content
        example: This is my <b>custom</b> template
        type: string
      Platform:
        allOf:
        - $ref: '#/definitions/portainer.CustomTemplatePlatform'
        description: |-
          Platform associated to the template.
          Valid values are: 1 - 'linux', 2 - 'windows'
          Required for Docker stacks
        enum:
        - 1
        - 2
        example: 1
      RepositoryAuthentication:
        description: 'Deprecated: use SourceID instead. Use basic authentication to
          clone the Git repository.'
        example: true
        type: boolean
      RepositoryPassword:
        description: 'Deprecated: use SourceID instead. Password used in basic authentication.
          Required when RepositoryAuthentication is true.'
        example: myGitPassword
        type: string
      RepositoryReferenceName:
        description: Reference name of a Git repository hosting the Stack file
        example: refs/heads/master
        type: string
      RepositoryURL:
        description: 'Deprecated: use SourceID instead. URL of a Git repository hosting
          the Stack file.'
        example: https://github.com/openfaas/faas
        type: string
      RepositoryUsername:
        description: 'Deprecated: use SourceID instead. Username used in basic authentication.
          Required when RepositoryAuthentication is true.'
        example: myGitUsername
        type: string
      SourceID:
        description: |-
          SourceID references an existing Source for git credentials/URL.
          When set, the inline URL and authentication fields are ignored.
        example: 1
        type: integer
      TLSSkipVerify:
        description: 'Deprecated: use SourceID instead. TLSSkipVerify skips SSL verification
          when cloning the Git repository.'
        example: false
        type: boolean
      Title:
        description: Title of the template
        example: Nginx
        type: string
      Type:
        allOf:
        - $ref: '#/definitions/portainer.StackType'
        description: |-
          Type of created stack:
          * 1 - swarm
          * 2 - compose
          * 3 - kubernetes
        enum:
        - 1
        - 2
        example: 1
      Variables:
        description: Definitions of variables in the stack file
        items:
          $ref: '#/definitions/portainer.CustomTemplateVariableDefinition'
        type: array
    required:
    - Description
    - SourceID
    - Title
    - Type
    type: object
  customtemplates.customTemplateUpdatePayload:
    properties:
      ComposeFilePathInRepository:
        default: docker-compose.yml
        description: Path to the Stack file inside the Git repository
        example: docker-compose.yml
        type: string
      Description:
        description: Description of the template
        example: High performance web server
        type: string
      EdgeTemplate:
        description: EdgeTemplate indicates if this template purpose for Edge Stack
        example: false
        type: boolean
      FileContent:
        description: Content of stack file
        type: string
      IsComposeFormat:
        description: IsComposeFormat indicates if the Kubernetes template is created
          from a Docker Compose file
        example: false
        type: boolean
      Logo:
        description: URL of the template's logo
        example: https://portainer.io/img/logo.svg
        type: string
      Note:
        description: A note that will be displayed in the UI. Supports HTML content
        example: This is my <b>custom</b> template
        type: string
      Platform:
        allOf:
        - $ref: '#/definitions/portainer.CustomTemplatePlatform'
        description: |-
          Platform associated to the template.
          Valid values are: 1 - 'linux', 2 - 'windows'
          Required for Docker stacks
        enum:
        - 1
        - 2
        example: 1
      RepositoryAuthentication:
        description: 'Deprecated: use SourceID instead. Use authentication to clone
          the Git repository.'
        example: true
        type: boolean
      RepositoryPassword:
        description: 'Deprecated: use SourceID instead. Password used in basic authentication
          or token used in token authentication. Required when RepositoryAuthentication
          is true.'
        example: myGitPassword
        type: string
      RepositoryReferenceName:
        description: Reference name of a Git repository hosting the Stack file
        example: refs/heads/master
        type: string
      RepositoryURL:
        description: 'Deprecated: use SourceID instead. URL of a Git repository hosting
          the Stack file.'
        example: https://github.com/openfaas/faas
        type: string
      RepositoryUsername:
        description: 'Deprecated: use SourceID instead. Username used in basic authentication.
          Required when RepositoryAuthentication is true.'
        example: myGitUsername
        type: string
      SourceID:
        description: |-
          SourceID references an existing Source for git credentials/URL.
          When set, the inline URL and authentication fields are ignored.
        example: 1
        type: integer
      TLSSkipVerify:
        description: 'Deprecated: use SourceID instead. TLSSkipVerify skips SSL verification
          when cloning the Git repository.'
        example: false
        type: boolean
      Title:
        description: Title of the template
        example: Nginx
        type: string
      Type:
        allOf:
        - $ref: '#/definitions/portainer.StackType'
        description: Type of created stack (1 - swarm, 2 - compose, 3 - kubernetes)
        enum:
        - 1
        - 2
        - 3
        example: 1
      Variables:
        description: Definitions of variables in the stack file
        items:
          $ref: '#/definitions/portainer.CustomTemplateVariableDefinition'
        type: array
    required:
    - Description
    - FileContent
    - Title
    - Type
    type: object
  customtemplates.fileResponse:
    properties:
      FileContent:
        type: string
    type: object
  docker.dashboardResponse:
    properties:
      containers:
        $ref: '#/definitions/stats.ContainerStats'
      images:
        $ref: '#/definitions/docker.imagesCounters'
      networks:
        type: integer
      services:
        type: integer
      stacks:
        type: integer
      volumes:
        type: integer
    type: object
  docker.imagesCounters:
    properties:
      size:
        type: integer
      total:
        type: integer
    type: object
  edge.DeployerOptionsPayload:
    properties:
      ForceRecreate:
        description: |-
          ForceRecreate is a flag indicating if the agent must force the redeployment of the stack.
          This field is only used when the Force Redeployment is triggered.
          Once the stack is redeployed, this field will be reset to false.
          For standard edge agent, this field is used in agent side
          For async edge agent, this field is used in both agent side and server side.
          This flag drives `docker compose up --force-recreate` option
        type: boolean
      Prune:
        description: |-
          Prune is a flag indicating if the agent must prune the containers or not when creating/updating an edge stack
          This flag drives `docker compose up --remove-orphans` and `docker stack up --prune` options
          Used only for EE
        type: boolean
      RemoveVolumes:
        description: |-
          RemoveVolumes is a flag indicating if the agent must remove the named volumes declared
          in the compose file and anonymouse volumes attached to containers
          This flag drives `docker compose down --volumes` option
          Used only for EE
        type: boolean
    type: object
  edge.RegistryCredentials:
    properties:
      Secret:
        type: string
      ServerURL:
        type: string
      Username:
        type: string
    type: object
  edge.StackPayload:
    properties:
      AlwaysCloneGitRepoForRelativePath:
        description: |-
          AlwaysCloneGitRepoForRelativePath is a flag indicating if the agent must always clone the git repository for relative path.
          This field is only valid when SupportRelativePath is true.
          Used only for EE
        type: boolean
      CreatedBy:
        description: |-
          CreatedBy is the username that created this stack
          Used for adding labels to Kubernetes manifests
        type: string
      CreatedByUserId:
        description: |-
          CreatedByUserId is the user ID that created this stack
          Used for adding labels to Kubernetes manifests
        type: string
      DeployerOptionsPayload:
        $ref: '#/definitions/edge.DeployerOptionsPayload'
      DirEntries:
        description: Content of stack folder
        items:
          $ref: '#/definitions/filesystem.DirEntry'
        type: array
      EdgeUpdateID:
        description: |-
          EdgeUpdateID is the ID of the edge update related to this stack.
          Used only for EE
        type: integer
      EntryFileName:
        description: Name of the stack entry file
        type: string
      EnvVars:
        description: |-
          Used only for EE
          EnvVars is a list of environment variables to inject into the stack
        items:
          $ref: '#/definitions/portainer.Pair'
        type: array
      FilesystemPath:
        description: Mount point for relative path
        type: string
      ForceUpdate:
        description: |-
          ForceUpdate is a flag indicating if the agent must force the update of the stack.
          Used only for EE
        type: boolean
      HelmConfig:
        allOf:
        - $ref: '#/definitions/portainer.HelmConfig'
        description: HelmConfig represents the Helm configuration for an edge stack
      ID:
        description: ID of the stack
        type: integer
      Name:
        description: Name of the stack
        type: string
      Namespace:
        description: Namespace to use for kubernetes stack. Keep empty to use the
          manifest namespace.
        type: string
      PrePullImage:
        description: |-
          PrePullImage is a flag indicating if the agent must pull the image before deploying the stack.
          Used only for EE
        type: boolean
      RePullImage:
        description: |-
          RePullImage is a flag indicating if the agent must pull the image if it is already present on the node.
          Used only for EE
        type: boolean
      ReadyRePullImage:
        description: |-
          Used only for EE async edge agent
          ReadyRePullImage is a flag to indicate whether the auto update is trigger to re-pull image
          Deprecated(2.36): use DeployerOptionsPayload.ForceRecreate instead
        type: boolean
      RegistryCredentials:
        description: |-
          RegistryCredentials holds the credentials for a Docker registry.
          Used only for EE
        items:
          $ref: '#/definitions/edge.RegistryCredentials'
        type: array
      RetryDeploy:
        description: |-
          RetryDeploy is a flag indicating if the agent must retry to deploy the stack if it fails.
          Used only for EE
        type: boolean
      RetryPeriod:
        description: |-
          RetryPeriod specifies the duration, in seconds, for which the agent should continue attempting to deploy the stack after a failure
          Used only for EE
        type: integer
      RollbackTo:
        description: RollbackTo specifies the stack file version to rollback to (only
          support to rollback to the last version currently)
        type: integer
      StackFileContent:
        description: Content of the stack file (for compatibility to agent version
          less than 2.19.0)
        type: string
      SupportPerDeviceConfigs:
        description: Whether the edge stack supports per device configs
        type: boolean
      SupportRelativePath:
        description: Is relative path supported
        type: boolean
      Version:
        description: Version of the stack file
        type: integer
    type: object
  edgegroups.decoratedEdgeGroup:
    properties:
      Dynamic:
        type: boolean
      EndpointIds:
        description: Shadow to avoid exposing in the API
        type: integer
      EndpointTypes:
        items:
          $ref: '#/definitions/portainer.EndpointType'
        type: array
      Endpoints:
        description: 'Deprecated: only used for API responses'
        items:
          type: integer
        type: array
      HasEdgeJob:
        type: boolean
      HasEdgeStack:
        type: boolean
      Id:
        description: EdgeGroup Identifier
        example: 1
        type: integer
      Name:
        type: string
      PartialMatch:
        type: boolean
      TagIds:
        items:
          type: integer
        type: array
      TrustedEndpoints:
        items:
          type: integer
        type: array
    type: object
  edgegroups.edgeGroupCreatePayload:
    properties:
      Dynamic:
        type: boolean
      Endpoints:
        items:
          type: integer
        type: array
      Name:
        type: string
      PartialMatch:
        type: boolean
      TagIDs:
        items:
          type: integer
        type: array
    type: object
  edgegroups.edgeGroupUpdatePayload:
    properties:
      Dynamic:
        type: boolean
      Endpoints:
        items:
          type: integer
        type: array
      Name:
        type: string
      PartialMatch:
        type: boolean
      TagIDs:
        items:
          type: integer
        type: array
    type: object
  edgejobs.edgeJobCreateFromFileContentPayload:
    properties:
      CronExpression:
        type: string
      EdgeGroups:
        items:
          type: integer
        type: array
      Endpoints:
        items:
          type: integer
        type: array
      FileContent:
        type: string
      Name:
        type: string
      Recurring:
        type: boolean
    type: object
  edgejobs.edgeJobFileResponse:
    properties:
      FileContent:
        type: string
    type: object
  edgejobs.edgeJobUpdatePayload:
    properties:
      CronExpression:
        type: string
      EdgeGroups:
        items:
          type: integer
        type: array
      Endpoints:
        items:
          type: integer
        type: array
      FileContent:
        type: string
      Name:
        type: string
      Recurring:
        type: boolean
    type: object
  edgejobs.fileResponse:
    properties:
      FileContent:
        type: string
    type: object
  edgejobs.taskContainer:
    properties:
      EndpointId:
        type: integer
      EndpointName:
        type: string
      Id:
        type: string
      LogsStatus:
        $ref: '#/definitions/portainer.EdgeJobLogsStatus'
    type: object
  edgestacks.edgeStackFromGitRepositoryPayload:
    properties:
      DeploymentType:
        allOf:
        - $ref: '#/definitions/portainer.EdgeStackDeploymentType'
        description: |-
          Deployment type to deploy this stack
          Valid values are: 0 - 'compose', 1 - 'kubernetes'
          compose is enabled only for docker environments
          kubernetes is enabled only for kubernetes environments
        enum:
        - 0
        - 1
        - 2
        example: 0
      EdgeGroups:
        description: List of identifiers of EdgeGroups
        example:
        - 1
        items:
          type: integer
        type: array
      FilePathInRepository:
        default: docker-compose.yml
        description: Path to the Stack file inside the Git repository
        example: docker-compose.yml
        type: string
      Name:
        description: |-
          Name of the stack
          Max length: 255
          Name must only contains lowercase characters, numbers, hyphens, or underscores
          Name must start with a lowercase character or number
          Example: stack-name or stack_123 or stackName
        example: stack-name
        type: string
      Registries:
        description: List of Registries to use for this stack
        items:
          type: integer
        type: array
      RepositoryAuthentication:
        description: 'Deprecated: Use SourceID instead. Use basic authentication to
          clone the Git repository.'
        example: true
        type: boolean
      RepositoryPassword:
        description: 'Deprecated: Use SourceID instead. Password used in basic authentication.'
        example: myGitPassword
        type: string
      RepositoryReferenceName:
        description: Reference name of a Git repository hosting the Stack file
        example: refs/heads/master
        type: string
      RepositoryURL:
        description: 'Deprecated: Use SourceID instead. URL of a Git repository hosting
          the Stack file.'
        example: https://github.com/openfaas/faas
        type: string
      RepositoryUsername:
        description: 'Deprecated: Use SourceID instead. Username used in basic authentication.'
        example: myGitUsername
        type: string
      SourceID:
        description: |-
          SourceID references an existing Source for git credentials/URL.
          When set, the inline URL and authentication fields are ignored.
        example: 1
        type: integer
      TLSSkipVerify:
        description: 'Deprecated: Use SourceID instead. TLSSkipVerify skips SSL verification
          when cloning the Git repository.'
        example: false
        type: boolean
      UseManifestNamespaces:
        description: Uses the manifest's namespaces instead of the default one
        type: boolean
    required:
    - EdgeGroups
    - Name
    type: object
  edgestacks.edgeStackFromStringPayload:
    properties:
      DeploymentType:
        allOf:
        - $ref: '#/definitions/portainer.EdgeStackDeploymentType'
        description: |-
          Deployment type to deploy this stack
          Valid values are: 0 - 'compose', 1 - 'kubernetes'
          compose is enabled only for docker environments
          kubernetes is enabled only for kubernetes environments
        enum:
        - 0
        - 1
        - 2
        example: 0
      EdgeGroups:
        description: List of identifiers of EdgeGroups
        example:
        - 1
        items:
          type: integer
        type: array
      Name:
        description: |-
          Name of the stack
          Max length: 255
          Name must only contains lowercase characters, numbers, hyphens, or underscores
          Name must start with a lowercase character or number
          Example: stack-name or stack_123 or stackName
        example: stack-name
        type: string
      Registries:
        description: List of Registries to use for this stack
        items:
          type: integer
        type: array
      StackFileContent:
        description: Content of the Stack file
        example: |-
          version: 3
           services:
           web:
           image:nginx
        type: string
      UseManifestNamespaces:
        description: Uses the manifest's namespaces instead of the default one
        type: boolean
    required:
    - Name
    - StackFileContent
    type: object
  edgestacks.stackFileResponse:
    properties:
      StackFileContent:
        type: string
    type: object
  edgestacks.updateEdgeStackPayload:
    properties:
      DeploymentType:
        $ref: '#/definitions/portainer.EdgeStackDeploymentType'
      EdgeGroups:
        items:
          type: integer
        type: array
      StackFileContent:
        type: string
      UpdateVersion:
        type: boolean
      UseManifestNamespaces:
        description: Uses the manifest's namespaces instead of the default one
        type: boolean
    type: object
  edgestacks.updateStatusPayload:
    properties:
      EndpointID:
        type: integer
      Error:
        type: string
      Status:
        $ref: '#/definitions/portainer.EdgeStackStatusType'
      Time:
        format: int64
        type: integer
      Version:
        type: integer
    type: object
  endpointedge.edgeJobResponse:
    properties:
      CollectLogs:
        description: Whether to collect logs
        example: true
        type: boolean
      CronExpression:
        description: A cron expression to schedule this job
        example: '* * * * *'
        type: string
      Id:
        description: EdgeJob Identifier
        example: 2
        type: integer
      Script:
        description: Script to run
        example: echo hello
        type: string
      Version:
        description: Version of this EdgeJob
        example: 2
        type: integer
    type: object
  endpointedge.endpointEdgeStatusInspectResponse:
    properties:
      checkin:
        description: The current value of CheckinInterval
        example: 5
        type: integer
      credentials:
        type: string
      port:
        description: The tunnel port
        example: 8732
        type: integer
      schedules:
        description: List of requests for jobs to run on the environment(endpoint)
        items:
          $ref: '#/definitions/endpointedge.edgeJobResponse'
        type: array
      stacks:
        description: List of stacks to be deployed on the environments(endpoints)
        items:
          $ref: '#/definitions/endpointedge.stackStatusResponse'
        type: array
      status:
        description: Status represents the environment(endpoint) status
        example: REQUIRED
        type: string
    type: object
  endpointedge.stackStatusResponse:
    properties:
      ID:
        description: EdgeStack Identifier
        example: 1
        type: integer
      Version:
        description: Version of this stack
        example: 3
        type: integer
    type: object
  endpointgroups.EndpointGroupResponse:
    properties:
      Description:
        description: Description associated to the environment(endpoint) group
        example: Environment(Endpoint) group description
        type: string
      Id:
        description: Environment(Endpoint) group Identifier
        example: 1
        type: integer
      Name:
        description: Environment(Endpoint) group name
        example: my-environment-group
        type: string
      TagIds:
        description: List of tags associated to this environment(endpoint) group
        items:
          type: integer
        type: array
      TeamAccessPolicies:
        $ref: '#/definitions/portainer.TeamAccessPolicies'
      Total:
        type: integer
      TypeInfo:
        $ref: '#/definitions/endpointgroups.EndpointGroupTypeInfo'
      UserAccessPolicies:
        $ref: '#/definitions/portainer.UserAccessPolicies'
    required:
    - Description
    - Id
    - Name
    type: object
  endpointgroups.EndpointGroupTypeInfo:
    properties:
      Docker:
        type: integer
      Kubernetes:
        type: integer
      Mixed:
        type: boolean
      Podman:
        type: integer
    required:
    - Docker
    - Kubernetes
    - Mixed
    - Podman
    type: object
  endpointgroups.endpointGroupCreatePayload:
    properties:
      AssociatedEndpoints:
        description: List of environment(endpoint) identifiers that will be part of
          this group
        example:
        - 1
        - 3
        items:
          type: integer
        type: array
      Description:
        description: Environment(Endpoint) group description
        example: description
        type: string
      Name:
        description: Environment(Endpoint) group name
        example: my-environment-group
        type: string
      TagIDs:
        description: List of tag identifiers to which this environment(endpoint) group
          is associated
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
    required:
    - Name
    type: object
  endpointgroups.endpointGroupUpdatePayload:
    properties:
      AssociatedEndpoints:
        description: List of environment(endpoint) identifiers that will be part of
          this group
        example:
        - 1
        - 3
        items:
          type: integer
        type: array
      Description:
        description: Environment(Endpoint) group description
        example: description
        type: string
      Name:
        description: Environment(Endpoint) group name
        example: my-environment-group
        type: string
      TagIDs:
        description: List of tag identifiers associated to the environment(endpoint)
          group
        example:
        - 3
        - 4
        items:
          type: integer
        type: array
      TeamAccessPolicies:
        $ref: '#/definitions/portainer.TeamAccessPolicies'
      UserAccessPolicies:
        $ref: '#/definitions/portainer.UserAccessPolicies'
    type: object
  endpoints.EnvironmentSummaryCountsResponse:
    properties:
      byGroup:
        items:
          $ref: '#/definitions/endpoints.groupCount'
        type: array
      byHealth:
        $ref: '#/definitions/endpoints.healthCounts'
      byPlatformType:
