  v1.Container:
    properties:
      args:
        description: |-
          Arguments to the entrypoint.
          The container image's CMD is used if this is not provided.
          Variable references $(VAR_NAME) are expanded using the container's environment. If a variable
          cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced
          to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will
          produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless
          of whether the variable exists or not. Cannot be updated.
          More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell
          +optional
          +listType=atomic
        items:
          type: string
        type: array
      command:
        description: |-
          Entrypoint array. Not executed within a shell.
          The container image's ENTRYPOINT is used if this is not provided.
          Variable references $(VAR_NAME) are expanded using the container's environment. If a variable
          cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced
          to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will
          produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless
          of whether the variable exists or not. Cannot be updated.
          More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell
          +optional
          +listType=atomic
        items:
          type: string
        type: array
      env:
        description: |-
          List of environment variables to set in the container.
          Cannot be updated.
          +optional
          +patchMergeKey=name
          +patchStrategy=merge
          +listType=map
          +listMapKey=name
        items:
          $ref: '#/definitions/v1.EnvVar'
        type: array
      envFrom:
        description: |-
          List of sources to populate environment variables in the container.
          The keys defined within a source may consist of any printable ASCII characters except '='.
          When a key exists in multiple
          sources, the value associated with the last source will take precedence.
          Values defined by an Env with a duplicate key will take precedence.
          Cannot be updated.
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.EnvFromSource'
        type: array
      image:
        description: |-
          Container image name.
          More info: https://kubernetes.io/docs/concepts/containers/images
          This field is optional to allow higher level config management to default or override
          container images in workload controllers like Deployments and StatefulSets.
          +optional
        type: string
      imagePullPolicy:
        allOf:
        - $ref: '#/definitions/v1.PullPolicy'
        description: |-
          Image pull policy.
          One of Always, Never, IfNotPresent.
          Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.
          Cannot be updated.
          More info: https://kubernetes.io/docs/concepts/containers/images#updating-images
          +optional
      lifecycle:
        allOf:
        - $ref: '#/definitions/v1.Lifecycle'
        description: |-
          Actions that the management system should take in response to container lifecycle events.
          Cannot be updated.
          +optional
      livenessProbe:
        allOf:
        - $ref: '#/definitions/v1.Probe'
        description: |-
          Periodic probe of container liveness.
          Container will be restarted if the probe fails.
          Cannot be updated.
          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
          +optional
      name:
        description: |-
          Name of the container specified as a DNS_LABEL.
          Each container in a pod must have a unique name (DNS_LABEL).
          Cannot be updated.
        type: string
      ports:
        description: |-
          List of ports to expose from the container. Not specifying a port here
          DOES NOT prevent that port from being exposed. Any port which is
          listening on the default "0.0.0.0" address inside a container will be
          accessible from the network.
          Modifying this array with strategic merge patch may corrupt the data.
          For more information See https://github.com/kubernetes/kubernetes/issues/108255.
          Cannot be updated.
          +optional
          +patchMergeKey=containerPort
          +patchStrategy=merge
          +listType=map
          +listMapKey=containerPort
          +listMapKey=protocol
        items:
          $ref: '#/definitions/v1.ContainerPort'
        type: array
      readinessProbe:
        allOf:
        - $ref: '#/definitions/v1.Probe'
        description: |-
          Periodic probe of container service readiness.
          Container will be removed from service endpoints if the probe fails.
          Cannot be updated.
          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
          +optional
      resizePolicy:
        description: |-
          Resources resize policy for the container.
          This field cannot be set on ephemeral containers.
          +featureGate=InPlacePodVerticalScaling
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.ContainerResizePolicy'
        type: array
      resources:
        allOf:
        - $ref: '#/definitions/v1.ResourceRequirements'
        description: |-
          Compute Resources required by this container.
          Cannot be updated.
          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          +optional
      restartPolicy:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartPolicy'
        description: |-
          RestartPolicy defines the restart behavior of individual containers in a pod.
          This overrides the pod-level restart policy. When this field is not specified,
          the restart behavior is defined by the Pod's restart policy and the container type.
          Additionally, setting the RestartPolicy as "Always" for the init container will
          have the following effect:
          this init container will be continually restarted on
          exit until all regular containers have terminated. Once all regular
          containers have completed, all init containers with restartPolicy "Always"
          will be shut down. This lifecycle differs from normal init containers and
          is often referred to as a "sidecar" container. Although this init
          container still starts in the init container sequence, it does not wait
          for the container to complete before proceeding to the next init
          container. Instead, the next init container starts immediately after this
          init container is started, or after any startupProbe has successfully
          completed.
          +optional
      restartPolicyRules:
        description: |-
          Represents a list of rules to be checked to determine if the
          container should be restarted on exit. The rules are evaluated in
          order. Once a rule matches a container exit condition, the remaining
          rules are ignored. If no rule matches the container exit condition,
          the Container-level restart policy determines the whether the container
          is restarted or not. Constraints on the rules:
          - At most 20 rules are allowed.
          - Rules can have the same action.
          - Identical rules are not forbidden in validations.
          When rules are specified, container MUST set RestartPolicy explicitly
          even it if matches the Pod's RestartPolicy.
          +featureGate=ContainerRestartRules
          +optional
          +listType=atomic
        items:
          $ref: '#/definitions/v1.ContainerRestartRule'
        type: array
      securityContext:
        allOf:
        - $ref: '#/definitions/v1.SecurityContext'
        description: |-
          SecurityContext defines the security options the container should be run with.
          If set, the fields of SecurityContext override the equivalent fields of PodSecurityContext.
          More info: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
          +optional
      startupProbe:
        allOf:
        - $ref: '#/definitions/v1.Probe'
        description: |-
          StartupProbe indicates that the Pod has successfully initialized.
          If specified, no other probes are executed until this completes successfully.
          If this probe fails, the Pod will be restarted, just as if the livenessProbe failed.
          This can be used to provide different probe parameters at the beginning of a Pod's lifecycle,
          when it might take a long time to load data or warm a cache, than during steady-state operation.
          This cannot be updated.
          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
          +optional
      stdin:
        description: |-
          Whether this container should allocate a buffer for stdin in the container runtime. If this
          is not set, reads from stdin in the container will always result in EOF.
          Default is false.
          +optional
        type: boolean
      stdinOnce:
        description: |-
          Whether the container runtime should close the stdin channel after it has been opened by
          a single attach. When stdin is true the stdin stream will remain open across multiple attach
          sessions. If stdinOnce is set to true, stdin is opened on container start, is empty until the
          first client attaches to stdin, and then remains open and accepts data until the client disconnects,
          at which time stdin is closed and remains closed until the container is restarted. If this
          flag is false, a container processes that reads from stdin will never receive an EOF.
          Default is false
          +optional
        type: boolean
      terminationMessagePath:
        description: |-
          Optional: Path at which the file to which the container's termination message
          will be written is mounted into the container's filesystem.
          Message written is intended to be brief final status, such as an assertion failure message.
          Will be truncated by the node if greater than 4096 bytes. The total message length across
          all containers will be limited to 12kb.
          Defaults to /dev/termination-log.
          Cannot be updated.
          +optional
        type: string
      terminationMessagePolicy:
        allOf:
        - $ref: '#/definitions/v1.TerminationMessagePolicy'
        description: |-
          Indicate how the termination message should be populated. File will use the contents of
          terminationMessagePath to populate the container status message on both success and failure.
          FallbackToLogsOnError will use the last chunk of container log output if the termination
          message file is empty and the container exited with an error.
          The log output is limited to 2048 bytes or 80 lines, whichever is smaller.
          Defaults to File.
          Cannot be updated.
          +optional
      tty:
        description: |-
          Whether this container should allocate a TTY for itself, also requires 'stdin' to be true.
          Default is false.
          +optional
        type: boolean
      volumeDevices:
        description: |-
          volumeDevices is the list of block devices to be used by the container.
          +patchMergeKey=devicePath
          +patchStrategy=merge
          +listType=map
          +listMapKey=devicePath
          +optional
        items:
          $ref: '#/definitions/v1.VolumeDevice'
        type: array
      volumeMounts:
        description: |-
          Pod volumes to mount into the container's filesystem.
          Cannot be updated.
          +optional
          +patchMergeKey=mountPath
          +patchStrategy=merge
          +listType=map
          +listMapKey=mountPath
        items:
          $ref: '#/definitions/v1.VolumeMount'
        type: array
      workingDir:
        description: |-
          Container's working directory.
          If not specified, the container runtime's default will be used, which
          might be configured in the container image.
          Cannot be updated.
          +optional
        type: string
    type: object
  v1.ContainerExtendedResourceRequest:
    properties:
      containerName:
        description: The name of the container requesting resources.
        type: string
      requestName:
        description: The name of the request in the special ResourceClaim which corresponds
          to the extended resource.
        type: string
      resourceName:
        description: The name of the extended resource in that container which gets
          backed by DRA.
        type: string
    type: object
  v1.ContainerImage:
    properties:
      names:
        description: |-
          Names by which this image is known.
          e.g. ["kubernetes.example/hyperkube:v1.0.7", "cloud-vendor.registry.example/cloud-vendor/hyperkube:v1.0.7"]
          +optional
          +listType=atomic
        items:
          type: string
        type: array
      sizeBytes:
        description: |-
          The size of the image in bytes.
          +optional
        type: integer
    type: object
  v1.ContainerPort:
    properties:
      containerPort:
        description: |-
          Number of port to expose on the pod's IP address.
          This must be a valid port number, 0 < x < 65536.
        type: integer
      hostIP:
        description: |-
          What host IP to bind the external port to.
          +optional
        type: string
      hostPort:
        description: |-
          Number of port to expose on the host.
          If specified, this must be a valid port number, 0 < x < 65536.
          If HostNetwork is specified, this must match ContainerPort.
          Most containers do not need this.
          +optional
        type: integer
      name:
        description: |-
          If specified, this must be an IANA_SVC_NAME and unique within the pod. Each
          named port in a pod must have a unique name. Name for the port that can be
          referred to by services.
          +optional
        type: string
      protocol:
        allOf:
        - $ref: '#/definitions/v1.Protocol'
        description: |-
          Protocol for port. Must be UDP, TCP, or SCTP.
          Defaults to "TCP".
          +optional
          +default="TCP"
    type: object
  v1.ContainerResizePolicy:
    properties:
      resourceName:
        allOf:
        - $ref: '#/definitions/v1.ResourceName'
        description: |-
          Name of the resource to which this resource resize policy applies.
          Supported values: cpu, memory.
      restartPolicy:
        allOf:
        - $ref: '#/definitions/v1.ResourceResizeRestartPolicy'
        description: |-
          Restart policy to apply when specified resource is resized.
          If not specified, it defaults to NotRequired.
    type: object
  v1.ContainerRestartPolicy:
    enum:
    - Always
    - Never
    - OnFailure
    type: string
    x-enum-varnames:
    - ContainerRestartPolicyAlways
    - ContainerRestartPolicyNever
    - ContainerRestartPolicyOnFailure
  v1.ContainerRestartRule:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartRuleAction'
        description: |-
          Specifies the action taken on a container exit if the requirements
          are satisfied. The only possible value is "Restart" to restart the
          container.
          +required
      exitCodes:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartRuleOnExitCodes'
        description: |-
          Represents the exit codes to check on container exits.
          +optional
          +oneOf=when
    type: object
  v1.ContainerRestartRuleAction:
    enum:
    - Restart
    - RestartAllContainers
    type: string
    x-enum-varnames:
    - ContainerRestartRuleActionRestart
    - ContainerRestartRuleActionRestartAllContainers
  v1.ContainerRestartRuleOnExitCodes:
    properties:
      operator:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartRuleOnExitCodesOperator'
        description: |-
          Represents the relationship between the container exit code(s) and the
          specified values. Possible values are:
          - In: the requirement is satisfied if the container exit code is in the
            set of specified values.
          - NotIn: the requirement is satisfied if the container exit code is
            not in the set of specified values.
          +required
      values:
        description: |-
          Specifies the set of values to check for container exit codes.
          At most 255 elements are allowed.
          +optional
          +listType=set
        items:
          type: integer
        type: array
    type: object
  v1.ContainerRestartRuleOnExitCodesOperator:
    enum:
    - In
    - NotIn
    type: string
    x-enum-varnames:
    - ContainerRestartRuleOnExitCodesOpIn
    - ContainerRestartRuleOnExitCodesOpNotIn
  v1.ContainerState:
    properties:
      running:
        allOf:
        - $ref: '#/definitions/v1.ContainerStateRunning'
        description: |-
          Details about a running container
          +optional
      terminated:
        allOf:
        - $ref: '#/definitions/v1.ContainerStateTerminated'
        description: |-
          Details about a terminated container
          +optional
      waiting:
        allOf:
        - $ref: '#/definitions/v1.ContainerStateWaiting'
        description: |-
          Details about a waiting container
          +optional
    type: object
  v1.ContainerStateRunning:
    properties:
      startedAt:
        description: |-
          Time at which the container was last (re-)started
          +optional
        type: string
    type: object
  v1.ContainerStateTerminated:
    properties:
      containerID:
        description: |-
          Container's ID in the format '<type>://<container_id>'
          +optional
        type: string
      exitCode:
        description: Exit status from the last termination of the container
        type: integer
      finishedAt:
        description: |-
          Time at which the container last terminated
          +optional
        type: string
      message:
        description: |-
          Message regarding the last termination of the container
          +optional
        type: string
      reason:
        description: |-
          (brief) reason from the last termination of the container
          +optional
        type: string
      signal:
        description: |-
          Signal from the last termination of the container
          +optional
        type: integer
      startedAt:
        description: |-
          Time at which previous execution of the container started
          +optional
        type: string
    type: object
  v1.ContainerStateWaiting:
    properties:
      message:
        description: |-
          Message regarding why the container is not yet running.
          +optional
        type: string
      reason:
        description: |-
          (brief) reason the container is not yet running.
          +optional
        type: string
    type: object
  v1.ContainerStatus:
    properties:
      allocatedResources:
        allOf:
        - $ref: '#/definitions/v1.ResourceList'
        description: |-
          AllocatedResources represents the compute resources allocated for this container by the
          node. Kubelet sets this value to Container.Resources.Requests upon successful pod admission
          and after successfully admitting desired pod resize.
          +featureGate=InPlacePodVerticalScalingAllocatedStatus
          +optional
      allocatedResourcesStatus:
        description: |-
          AllocatedResourcesStatus represents the status of various resources
          allocated for this Pod.
          +featureGate=ResourceHealthStatus
          +optional
          +patchMergeKey=name
          +patchStrategy=merge
          +listType=map
          +listMapKey=name
        items:
          $ref: '#/definitions/v1.ResourceStatus'
        type: array
      containerID:
        description: |-
          ContainerID is the ID of the container in the format '<type>://<container_id>'.
          Where type is a container runtime identifier, returned from Version call of CRI API
          (for example "containerd").
          +optional
        type: string
      image:
        description: |-
          Image is the name of container image that the container is running.
          The container image may not match the image used in the PodSpec,
          as it may have been resolved by the runtime.
          More info: https://kubernetes.io/docs/concepts/containers/images.
        type: string
      imageID:
        description: |-
          ImageID is the image ID of the container's image. The image ID may not
          match the image ID of the image used in the PodSpec, as it may have been
          resolved by the runtime.
        type: string
      lastState:
        allOf:
        - $ref: '#/definitions/v1.ContainerState'
        description: |-
          LastTerminationState holds the last termination state of the container to
          help debug container crashes and restarts. This field is not
          populated if the container is still running and RestartCount is 0.
          +optional
      name:
        description: |-
          Name is a DNS_LABEL representing the unique name of the container.
          Each container in a pod must have a unique name across all container types.
          Cannot be updated.
        type: string
      ready:
        description: |-
          Ready specifies whether the container is currently passing its readiness check.
          The value will change as readiness probes keep executing. If no readiness
          probes are specified, this field defaults to true once the container is
          fully started (see Started field).

          The value is typically used to determine whether a container is ready to
          accept traffic.
        type: boolean
      resources:
        allOf:
        - $ref: '#/definitions/v1.ResourceRequirements'
        description: |-
          Resources represents the compute resource requests and limits that have been successfully
          enacted on the running container after it has been started or has been successfully resized.
          +featureGate=InPlacePodVerticalScaling
          +optional
      restartCount:
        description: |-
          RestartCount holds the number of times the container has been restarted.
          Kubelet makes an effort to always increment the value, but there
          are cases when the state may be lost due to node restarts and then the value
          may be reset to 0. The value is never negative.
        type: integer
      started:
        description: |-
          Started indicates whether the container has finished its postStart lifecycle hook
          and passed its startup probe.
          Initialized as false, becomes true after startupProbe is considered
          successful. Resets to false when the container is restarted, or if kubelet
          loses state temporarily. In both cases, startup probes will run again.
          Is always true when no startupProbe is defined and container is running and
          has passed the postStart lifecycle hook. The null value must be treated the
          same as false.
          +optional
        type: boolean
      state:
        allOf:
        - $ref: '#/definitions/v1.ContainerState'
        description: |-
          State holds details about the container's current condition.
          +optional
      stopSignal:
        allOf:
        - $ref: '#/definitions/v1.Signal'
        description: |-
          StopSignal reports the effective stop signal for this container
          +featureGate=ContainerStopSignals
          +optional
      user:
        allOf:
        - $ref: '#/definitions/v1.ContainerUser'
        description: |-
          User represents user identity information initially attached to the first process of the container
          +featureGate=SupplementalGroupsPolicy
          +optional
      volumeMounts:
        description: |-
          Status of volume mounts.
          +optional
          +patchMergeKey=mountPath
          +patchStrategy=merge
          +listType=map
          +listMapKey=mountPath
        items:
          $ref: '#/definitions/v1.VolumeMountStatus'
        type: array
    type: object
  v1.ContainerUser:
    properties:
      linux:
        allOf:
        - $ref: '#/definitions/v1.LinuxContainerUser'
        description: |-
          Linux holds user identity information initially attached to the first process of the containers in Linux.
          Note that the actual running identity can be changed if the process has enough privilege to do so.
          +optional
    type: object
  v1.DNSPolicy:
    enum:
