<page-header title="pageTitle" breadcrumbs="pageBreadcrumbs" reload="true"> </page-header>

<div class="row">
  <div class="col-lg-12 col-md-12 col-xs-12">
    <theme-settings></theme-settings>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-md-12 col-xs-12">
    <language-settings></language-settings>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-md-12 col-xs-12">
    <rd-widget>
      <rd-widget-header icon="lock" title-text="{{ t('account.change_password') }}"></rd-widget-header>
      <rd-widget-body>
        <form name="form" class="form-horizontal" style="margin-top: 15px">
          <!-- current-password-input -->
          <div class="form-group">
            <label for="current_password" class="col-sm-3 col-lg-2 control-label required text-left">{{ t('account.current_password') }}</label>
            <div class="col-sm-9 col-lg-10">
              <input type="password" class="form-control" ng-model="formValues.currentPassword" id="current_password" />
            </div>
          </div>
          <!-- !current-password-input -->
          <!-- new-password-input -->
          <div class="form-group">
            <label for="new_password" class="col-sm-3 col-lg-2 control-label required text-left">{{ t('account.new_password') }}</label>
            <div class="col-sm-9 col-lg-10">
              <input type="password" class="form-control" ng-model="formValues.newPassword"
                ng-minlength="requiredPasswordLength" id="new_password" name="new_password" />
            </div>
          </div>
          <!-- !new-password-input -->

          <!-- confirm-password-input -->
          <div class="form-group">
            <label for="confirm_password" class="col-sm-3 col-lg-2 control-label required text-left">{{ t('account.confirm_password') }}</label>
            <div class="col-sm-9 col-lg-10">
              <div class="input-group">
                <input type="password" class="form-control" ng-model="formValues.confirmPassword"
                  id="confirm_password" />
                <span class="input-group-addon">
                  <pr-icon icon="'check'" class="icon-success"
                    ng-if="formValues.newPassword === formValues.confirmPassword"></pr-icon>
                  <pr-icon icon="'x'" class="icon-danger"
                    ng-if="!(formValues.newPassword === formValues.confirmPassword)"></pr-icon>
                </span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="col-sm-3 col-lg-2"></div>
            <div class="col-sm-8">
              <password-check-hint password-valid="form.new_password.$valid && formValues.newPassword"
                force-change-password="forceChangePassword"></password-check-hint>
            </div>
          </div>
          <!-- !confirm-password-input -->
          <div class="form-group">
            <div class="col-sm-12">
              <button type="submit" class="btn btn-primary btn-sm"
                ng-disabled="(AuthenticationMethod !== 1 && !isInitialAdmin) || !formValues.currentPassword || !formValues.newPassword || form.$invalid || formValues.newPassword !== formValues.confirmPassword"
                ng-click="updatePassword()">
                {{ t('account.update_password') }}
              </button>
              <button type="submit" class="btn btn-primary btn-sm" ng-click="skipPasswordChange()"
                ng-if="forceChangePassword && timesPasswordChangeSkipped < 2">
                {{ t('account.remind_me_later') }}
              </button>
              <span class="text-muted small vertical-center" style="margin-left: 5px"
                ng-if="AuthenticationMethod === 2 && !isInitialAdmin">
                <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
                {{ t('account.ldap_warning') }}
              </span>
              <span class="text-muted small vertical-center" style="margin-left: 5px"
                ng-if="AuthenticationMethod === 3 && !isInitialAdmin">
                <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
                {{ t('account.oauth_warning') }}
              </span>
            </div>
          </div>
          <div ng-if="userRole === 1">
            <p class="text-muted vertical-center">
              <pr-icon icon="'alert-circle'" class-name="'icon-primary'"></pr-icon>
              {{ t('account.min_password_hint_prefix') }} <a ui-sref="portainer.settings.authentication">{{ t('account.min_password_hint_link') }}</a>
            </p>
          </div>
        </form>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>

<application-settings-widget></application-settings-widget>

<access-tokens-datatable ui-can-exit="uiCanExit()"></access-tokens-datatable>

<helm-repository-datatable></helm-repository-datatable>
