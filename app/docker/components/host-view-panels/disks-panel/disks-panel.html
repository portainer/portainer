<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
    <rd-widget>
      <rd-widget-header icon="code" title-text="{{ 'docker_host.physical_disks' | i18n }}"></rd-widget-header>
      <rd-widget-body classes="no-padding">
        <table class="table">
          <thead>
            <tr>
              <th>{{ 'docker_host.vendor' | i18n }}</th>
              <th>{{ 'docker_host.size' | i18n }}</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-if="$ctrl.disks" ng-repeat="disk in $ctrl.disks">
              <td>{{ disk.Vendor }}</td>
              <td>{{ disk.Size | humansize }}</td>
            </tr>
            <tr ng-if="$ctrl.disks === undefined">
              <td colspan="2" class="text-muted text-center">{{ 'common.loading' | i18n }}</td>
            </tr>
            <tr ng-if="$ctrl.disks === null">
              <td colspan="2" class="text-muted text-center"> {{ 'docker_host.failed_load_disks' | i18n }} </td>
            </tr>
            <tr ng-if="$ctrl.disks.length === 0">
              <td colspan="2" class="text-muted text-center"> {{ 'docker_host.no_disks_available' | i18n }} </td>
            </tr>
          </tbody>
        </table>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>
