<!-- NFS-settings -->
<div ng-show="$ctrl.data.useNFS">
  <ng-form class="form-horizontal" name="nfsInformationForm">
    <div class="col-sm-12 form-section-title"> {{ 'docker_volumes.nfs_settings' | i18n }} </div>
    <!-- address-input -->
    <div class="form-group col-md-12">
      <label for="nfs_address" class="col-sm-2 col-md-1 control-label required text-left">{{ 'docker_volumes.address' | i18n }}</label>
      <div class="col-sm-10 col-md-11">
        <input
          type="text"
          class="form-control"
          ng-model="$ctrl.data.serverAddress"
          name="nfs_address"
          placeholder="e.g. my.nfs-server.com OR xxx.xxx.xxx.xxx"
          required
          data-cy="nfs-address-input"
        />
      </div>
    </div>
    <div class="form-group col-md-12" ng-show="nfsInformationForm.nfs_address.$invalid">
      <div class="small text-warning">
        <div ng-messages="nfsInformationForm.nfs_address.$error">
          <p ng-message="required"> <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> {{ 'validation.field_required' | i18n }}</p>
        </div>
      </div>
    </div>
    <!-- !address-input -->
    <!-- version-input -->
    <div class="form-group col-md-12">
      <label for="nfs_version" class="col-sm-2 col-md-1 control-label text-left">{{ 'docker_volumes.nfs_version' | i18n }}</label>
      <div class="col-sm-10 col-md-11">
        <select
          class="form-control"
          ng-model="$ctrl.data.version"
          name="nfs_version"
          ng-options="version for version in $ctrl.data.versions"
          required
          data-cy="nfs-version-select"
        ></select>
      </div>
    </div>
    <div class="form-group col-md-12" ng-show="nfsInformationForm.nfs_version.$invalid">
      <div class="small text-warning">
        <div ng-messages="nfsInformationForm.nfs_version.$error">
          <p ng-message="required"> <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> {{ 'validation.field_required' | i18n }}</p>
        </div>
      </div>
    </div>
    <!-- !version-input -->
    <!-- mount-point-input -->
    <div class="form-group col-md-12">
      <label for="nfs_mountpoint" class="col-sm-2 col-md-1 control-label required text-left">{{ 'docker_volumes.nfs_mount_point' | i18n }}</label>
      <div class="col-sm-10 col-md-11">
        <input
          type="text"
          data-cy="nfs-mountpoint-input"
          class="form-control"
          ng-model="$ctrl.data.mountPoint"
          name="nfs_mountpoint"
          placeholder="e.g. /export/share, :/export/share, address:/export/share, /share, :/share or address:/share"
          required
        />
      </div>
    </div>
    <div class="form-group col-md-12" ng-show="nfsInformationForm.nfs_mountpoint.$invalid">
      <div class="small text-warning">
        <div ng-messages="nfsInformationForm.nfs_mountpoint.$error">
          <p ng-message="required"> <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> {{ 'validation.field_required' | i18n }}</p>
        </div>
      </div>
    </div>
    <!-- !mount-point-input -->
    <!-- options-input -->
    <div class="form-group col-md-12">
      <label for="nfs_options" class="col-sm-2 col-md-1 control-label text-left"
        >{{ 'docker_volumes.options' | i18n }}
        <portainer-tooltip message="'docker_volumes.options_tooltip' | i18n"></portainer-tooltip>
      </label>
      <div class="col-sm-10 col-md-11">
        <input type="text" class="form-control" ng-model="$ctrl.data.options" name="nfs_options" placeholder="e.g. rw,noatime,tcp ..." required data-cy="nfs-options-input" />
      </div>
    </div>
    <div class="form-group col-md-12" ng-show="nfsInformationForm.nfs_options.$invalid">
      <div class="small text-warning">
        <div ng-messages="nfsInformationForm.nfs_options.$error">
          <p ng-message="required"> <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> {{ 'validation.field_required' | i18n }}</p>
        </div>
      </div>
    </div>
    <!-- !options-input -->
  </ng-form>
</div>
<!-- !NFS-settings -->
