<page-header title="'k8s_registries.registry_access' | i18n" breadcrumbs="[{label:('sidebar.registries' | i18n), link:'kubernetes.registries'}, $ctrl.registry.Name, ('k8s_registries.access_management' | i18n)]" reload="true"> </page-header>

<registry-details registry="$ctrl.registry" ng-if="$ctrl.registry"></registry-details>

<div class="row">
  <div class="col-sm-12">
    <rd-widget>
      <rd-widget-header icon="user-x" title-text="{{ 'k8s_registries.create_access' | i18n }}"></rd-widget-header>
      <rd-widget-body>
        <form class="form-horizontal">
          <div class="form-group">
            <label class="col-sm-3 col-lg-2 control-label text-left" style="padding-top: 0"> {{ 'k8s_registries.select_namespaces' | i18n }} </label>
            <div class="col-sm-9 col-lg-4" style="margin-bottom: 15px">
              <span class="small text-muted" ng-if="!$ctrl.resourcePools.length"> {{ 'k8s_registries.no_namespaces' | i18n }} </span>

              <namespaces-selector
                ng-if="$ctrl.resourcePools.length"
                value="$ctrl.selectedResourcePools"
                namespaces="$ctrl.resourcePools"
                placeholder="'Select one or more namespaces'"
                on-change="($ctrl.onChangeResourcePools)"
                allow-select-all="true"
              ></namespaces-selector>
            </div>
            <div class="col-sm-12 small text-muted vertical-center">
              <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
              {{ 'k8s_registries.credentials_warning' | i18n }}
            </div>
          </div>

          <!-- actions -->
          <div class="form-group">
            <div class="col-sm-12">
              <button
                type="submit"
                class="btn btn-primary btn-sm !ml-0"
                ng-disabled="$ctrl.selectedResourcePools.length === 0 || $ctrl.state.actionInProgress"
                ng-click="$ctrl.submit()"
                button-spinner="$ctrl.state.actionInProgress"
              >
                <span ng-hide="$ctrl.state.actionInProgress" class="vertical-center"><pr-icon icon="'plus'" size="'sm'"></pr-icon> {{ 'k8s_registries.create_access' | i18n }}</span>
                <span ng-show="$ctrl.state.actionInProgress">{{ 'k8s_registries.creating_access' | i18n }}</span>
              </button>
            </div>
          </div>
          <!-- !actions -->
        </form>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>

<kube-registry-access-table dataset="$ctrl.savedResourcePools" on-remove="($ctrl.handleRemove)"></kube-registry-access-table>
