<page-header
  ng-if="ctrl.state.viewReady"
  title="'k8s_logs.application_logs' | i18n"
  breadcrumbs="[
    { label:('k8s_applications.namespaces' | i18n), link:'kubernetes.resourcePools' },
    {
      label:ctrl.application.ResourcePool,
      link: 'kubernetes.resourcePools.resourcePool',
      linkParams:{ id: ctrl.application.ResourcePool }
    },
    { label:('k8s_applications.applications' | i18n), link:'kubernetes.applications' },
    {
      label:ctrl.application.Name,
      link: 'kubernetes.applications.application',
      linkParams:{ name: ctrl.application.Name, namespace: ctrl.application.ResourcePool }
    },
     ('k8s_logs.pods' | i18n),
     ctrl.podName,
     ('k8s_logs.containers' | i18n),
     ctrl.containerName,
     ('k8s_logs.logs' | i18n)
     ]"
  reload="true"
>
</page-header>

<kubernetes-view-loading view-ready="ctrl.state.viewReady"></kubernetes-view-loading>

<div ng-if="ctrl.state.viewReady">
  <div class="row">
    <div class="col-sm-12">
      <rd-widget>
        <rd-widget-body>
          <form class="form-horizontal row" autocomplete="off">
            <div class="col-sm-12 form-section-title"> {{ 'common.actions' | i18n }} </div>
            <!-- auto-refresh -->
            <div class="form-group">
              <label class="col-sm-3 col-lg-2 control-label text-left">
                {{ 'common.auto_refresh' | i18n }}
                <portainer-tooltip message="'k8s_logs.auto_refresh_tooltip_5s' | i18n"></portainer-tooltip>
              </label>
              <div class="col-sm-8">
                <label class="switch"> <input type="checkbox" ng-model="ctrl.state.autoRefresh" ng-change="ctrl.updateAutoRefresh()" /><span class="slider round"></span> </label>
              </div>
            </div>
            <!-- !auto-refresh -->
            <!-- search -->
            <div class="form-group">
              <label for="logs_search" class="col-sm-3 col-lg-2 control-label text-left"> {{ 'docker_log_viewer.search' | i18n }} </label>
              <div class="col-sm-8">
                <input
                  class="form-control"
                  type="text"
                  name="logs_search"
                  ng-model="ctrl.state.search"
                  ng-change="ctrl.state.selectedLines.length = 0;"
                  placeholder="Filter..."
                  auto-focus
                />
              </div>
            </div>
            <!-- !search -->
            <!-- actions -->
            <div class="form-group">
              <div class="col-sm-12">
                <button class="btn btn-primary btn-sm !ml-0" type="button" ng-click="ctrl.downloadLogs()"> <pr-icon icon="'download'"></pr-icon> {{ 'docker_log_viewer.download_logs' | i18n }} </button>
              </div>
            </div>
            <!-- !actions -->
          </form>
        </rd-widget-body>
      </rd-widget>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12 h-[max(400px,calc(100vh-380px))]">
      <pre class="log_viewer widget">
        <div ng-repeat="log in ctrl.state.filteredLogs = (ctrl.applicationLogs | filter:{ 'line': ctrl.state.search }) track by $index" class="line" ng-if="log.line"><p class="inner_line"><span ng-repeat="span in log.spans track by $index" ng-style="{ 'color': span.fgColor, 'background-color': span.bgColor, 'font-weight': span.fontWeight }">{{ span.text }}</span></p></div>
        <div ng-if="ctrl.applicationLogs.length && !ctrl.state.filteredLogs.length" class="line"><p class="inner_line">{{ 'docker_log_viewer.no_matching_filter' | i18n:{ search: ctrl.state.search } }}</p></div>
        <div ng-if="ctrl.applicationLogs.length === 0" class="line"><p class="inner_line">{{ 'docker_log_viewer.no_logs_available' | i18n }}</p></div></pre>
    </div>
  </div>
</div>
